[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iso52016-simulator"
version = "0.1.0"
description = "RoomCurve – hourly room simulation per DIN EN ISO 52016-1"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Mario Vukadinovic"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
]

[project.urls]
Repository = "https://github.com/m4rio-eng/roomcurve"

[project.optional-dependencies]
gui = ["streamlit>=1.28.0", "plotly>=5.0.0", "pandas>=1.3.0"]
verifizierung = ["matplotlib>=3.5.0"]
dev = ["pytest", "black", "mypy"]

[project.scripts]
iso52016-gui = "gui.app:main"

[tool.setuptools.packages.find]
include = ["iso52016*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
